name: Binance API connectivity

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/binance-connectivity.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Probe official Binance market-data endpoints
        run: |
          python - <<'PY'
          import sys
          import requests

          checks = [
              (
                  "Spot ping",
                  "https://data-api.binance.vision/api/v3/ping",
                  None,
              ),
              (
                  "Spot 5m klines",
                  "https://data-api.binance.vision/api/v3/klines",
                  {"symbol": "BTCUSDT", "interval": "5m", "limit": 1},
              ),
              (
                  "USD-M Futures ping",
                  "https://fapi.binance.com/fapi/v1/ping",
                  None,
              ),
              (
                  "USD-M Futures 5m klines",
                  "https://fapi.binance.com/fapi/v1/klines",
                  {"symbol": "BTCUSDT", "interval": "5m", "limit": 1},
              ),
          ]

          failures = []
          for name, url, params in checks:
              try:
                  response = requests.get(url, params=params, timeout=20)
                  print(f"{name}: HTTP {response.status_code}")
                  print(response.text[:500])
                  if not response.ok:
                      failures.append(name)
              except requests.RequestException as error:
                  print(f"{name}: request failed: {error}")
                  failures.append(name)

          if failures:
              print("Unavailable checks: " + ", ".join(failures))
              sys.exit(1)
          PY
